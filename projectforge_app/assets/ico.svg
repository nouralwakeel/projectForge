<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3FD4"/>
      <stop offset="35%" stop-color="#D4568A"/>
      <stop offset="70%" stop-color="#2E8BC0"/>
      <stop offset="100%" stop-color="#E6A817"/>
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4568A"/>
      <stop offset="50%" stop-color="#8B3FD4"/>
      <stop offset="100%" stop-color="#2E8BC0"/>
    </linearGradient>

    <!-- Depth Gradient -->
    <linearGradient id="depthGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B2C9D"/>
      <stop offset="100%" stop-color="#1A73B5"/>
    </linearGradient>

    <!-- Tassel Gradient -->
    <linearGradient id="tasselGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E8BC0"/>
      <stop offset="50%" stop-color="#D4568A"/>
      <stop offset="100%" stop-color="#8B3FD4"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity="0.25"/>
    </filter>

  </defs>

  <!-- Rounded Background -->
  <rect width="1024" height="1024" rx="240"
        fill="url(#bgGradient)"/>

  <!-- Ambient Glow -->
  <circle cx="512" cy="430" r="280"
          fill="#FFFFFF"
          opacity="0.08"/>

  <!-- Graduation Cap -->
  <g filter="url(#glow)">

    <!-- Bottom Layer -->
    <path d="M250 470 L512 560 L774 470 L774 525 L512 615 L250 525 Z"
          fill="url(#depthGradient)"
          opacity="0.95"/>

    <!-- Top Surface -->
    <path d="M250 430 L512 330 L774 430 L512 530 Z"
          fill="url(#capGradient)"
          stroke="#FFFFFF"
          stroke-width="8"
          filter="url(#shadow)"/>

    <!-- Highlight -->
    <path d="M512 330 L774 430"
          stroke="#FFFFFF"
          stroke-width="10"
          opacity="0.35"/>

    <!-- Center Circle -->
    <circle cx="512" cy="470" r="28"
            fill="#FFFFFF"
            opacity="0.95"/>

    <circle cx="512" cy="470" r="15"
            fill="url(#bgGradient)"/>

    <!-- Tassel -->
    <line x1="512" y1="470"
          x2="635" y2="650"
          stroke="url(#tasselGradient)"
          stroke-width="12"
          stroke-linecap="round"/>

    <!-- Tassel Ball -->
    <circle cx="635" cy="650" r="22"
            fill="url(#tasselGradient)"/>

    <!-- Tassel Threads -->
    <path d="M635 675 L620 725
             M635 675 L635 735
             M635 675 L650 725"
          stroke="url(#tasselGradient)"
          stroke-width="10"
          stroke-linecap="round"/>

  </g>

</svg>